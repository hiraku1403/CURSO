<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Parquímetro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1> Parquímetro Interativo</h1>
        <div class="input-group">
            <label for="valor">Valor Depositado (R$):</label>
            <input type="number" id="valor" step="0.01" placeholder="Ex: 2.50">
            <button onclick="app.processarPagamento()">Confirmar</button>
        </div>
        
        <div id="resultado" class="resultado hidden">
            <p id="msgTempo"></p>
            <p id="msgTroco"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
