<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro com Busca de CEP</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="container">
        <h1>Cadastro de Usuário</h1>
        <form id="cadastroForm">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="form-group">
                <label for="cep">CEP (apenas números):</label>
                <input type="text" id="cep" maxlength="8" placeholder="00000000" required>
                <small id="cepErro" style="color: red; display: none;">CEP inválido!</small>
            </div>

            <div class="form-group">
                <label for="logradouro">Rua/Logradouro:</label>
                <input type="text" id="logradouro" readonly>
            </div>

            <div class="form-group">
                <label for="bairro">Bairro:</label>
                <input type="text" id="bairro" readonly>
            </div>

            <div class="form-group">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" readonly>
            </div>

            <div class="form-group">
                <label for="uf">Estado (UF):</label>
                <input type="text" id="uf" readonly>
            </div>

            <button type="submit">Finalizar Cadastro</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
