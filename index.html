<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site da Confeitaria Ana</title>
    <script src="calculadora.js"></script>
    <link rel="stylesheet" href="style.css" >
      <style type="css">
      * {margin: 0; border: 0;}
      body{ font-family: Verdana, Geneva, Tahoma, sans-serif;}
      ul > li{ color: #d64242;}
  </style>
</head>
<body>
    <header>
        <h1> Matheus Henn</h1>
        <p>Desenvolvedor WEB</p>
        <nav>
        <ul>
                <li><a href="contato.html">Contato</a></li>
                <li><a href="#">Doces</a></li>
                <li><a href="#">Salgados</a></li>
            </ul>
          </nav>  
    </header>
    
    
    <main>
        <section>
            <h2>Sobre mim</h2>
            <p>Olá sou Matheus</p>
        </section>
        <section>
            <label for="valor">Valor Total (R$)</label>
            <input type="number" id="valor">
            <label for="desconto">Desconto (%)</label>
            <input type="number" id="desconto">
            <p id="resultado"></p>
            <button onclick="calcularDesconto()">Calcular</button>
        </section>
         <section>
            <label for="Peso">Peso (KG)</label>
            <input type="number" id="peso">

            <label for="altura">Altura (m)</label>
            <input type="number" id="altura">
        
            <p id="valorImc"></p>
            <p id="classificacao"></p>
            <button onclick="calcularIMC()">Calcular</button>
        </section>
         <section>
            <form>
                <input id="valor" type="number" placeholder="Digite um valor" />
                <select id="categoria">
                    <option>Alimentação</option>
                    <option>Transporte</option>
                    <option>Lazer</option>
                </select>
                <button onclick="adicionarGasto()" type="button">Adicionar</button>
            </form>
           <p id="Alimentação"> Alimentação: R$ 0</p>
           <p id="Transporte">Transporte: R$ 0</p>
           <p id="Lazer">Lazer: R$ 0</p>
           <p id="Total">Total: R$ 0</p>
        </section>
        
    </main>
    <footer>
        <p>&copy; 2026 - Todos os direitos reservados</p>
    </footer>
</body>
</html>
